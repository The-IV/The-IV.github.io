<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Music Demo</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
        <link rel="stylesheet" href="md.css">
    </head>
    
    <body class="music-page">

        <nav>
            <ul>
                <li><a href="../">Home</a></li>
            </ul>
        </nav>
        <div class="bg-layer" id="bg-a"></div>
        <div class="bg-layer" id="bg-b"></div>
        <main class="music-container">
            <header class="music-header">
                <p class="eyebrow">AUDIO ENGINEERING & PRODUCTION</p>
                <h1>My Set List</h1>
                <p>
                    A collection of demos showcasing my production,
                    mixing, and sound design.
                </p>
            </header>

            <div id="albums"></div>
            
        </main>

        <section class="music-player" aria-label="Audio player">
            <div class="now-playing">
                <div class="mini-art">
                    <i class="fa-solid fa-compact-disc"></i>
                </div>
                <div>
                    <h2 id="current-title">Select a track</h2>
                    <p id="current-status">Music Portfolio</p>
                </div>
            </div>

            <div class="player-controls">
                <div class="control-buttons">
                    <button id="prev-track"
                            aria-label="Previous track">
                        <i class="fa-solid fa-backward-step"></i>
                    </button>

                    <button id="toggle-play"
                            class="main-play"
                            aria-label="Play">
                        <i class="fa-solid fa-play"></i>
                    </button>

                    <button id="next-track"
                            aria-label="Next track">
                        <i class="fa-solid fa-forward-step"></i>
                    </button>
                </div>

                <div class="timeline">
                    <span id="current-time">0:00</span>
                    <input id="seek-bar"
                        type="range"
                        min="0"
                        max="100"
                        value="0"
                        step="0.1"
                        aria-label="Seek through track">
                    <span id="duration">0:00</span>
                </div>
            </div>
        </section>

        <audio id="audio-player" preload="metadata"></audio>

        <script src="albums.js"></script>
        <script src="music-player.js"></script>
    </body>

</html>
