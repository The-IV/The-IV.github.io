<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Music Demo</title>
        <link rel="stylesheet" href="md.css">
    </head>
    
    <body class="game-project music-page">

        <nav>
            <ul>
                <li><a href="../">Home</a></li>
            </ul>
        </nav>

        <main class="music-container">
            <header class="music-header">
                <p class="eyebrow">AUDIO ENGINEERING & PRODUCTION</p>
                <h1>My Set List</h1>
                <p>
                    A collection of demos showcasing my production,
                    mixing, and sound design.
                </p>
            </header>

            <section class="track-section" aria-label="Music tracks">

                <div class="track-row"
                    data-src="../Music/Audio/JSL.mp3">
                    <div class="track-art">
                        <i class="fa-solid fa-wave-square"></i>
                    </div>
                    <div class="track-info">
                        <h2>Demo Track 1</h2>
                        <p>Production Demo</p>
                    </div>
                    <button class="track-play"
                            aria-label="Play Demo Track 1">
                        <i class="fa-solid fa-play"></i>
                    </button>
                </div>

                <div class="track-row"
                    data-src="../Music/Audio/Comp 3.mp3">
                    <div class="track-art">
                        <i class="fa-solid fa-sliders"></i>
                    </div>
                    <div class="track-info">
                        <h2>Demo Track 2</h2>
                        <p>Mixing Demo</p>
                    </div>
                    <button class="track-play"
                            aria-label="Play Demo Track 2">
                        <i class="fa-solid fa-play"></i>
                    </button>
                </div>

                <div class="track-row"
                    data-src="../Music/Audio/Dancehall Pass.mp3">
                    <div class="track-art">
                        <i class="fa-solid fa-compact-disc"></i>
                    </div>
                    <div class="track-info">
                        <h2>Demo Track 3</h2>
                        <p>Genre Exploration</p>
                    </div>
                    <button class="track-play"
                            aria-label="Play Demo Track 3">
                        <i class="fa-solid fa-play"></i>
                    </button>
                </div>

                <div class="track-row"
                    data-src="../Music/Audio/Ascend.mp3">
                    <div class="track-art">
                        <i class="fa-solid fa-music"></i>
                    </div>
                    <div class="track-info">
                        <h2>Demo Track 4</h2>
                        <p>Original Production</p>
                    </div>
                    <button class="track-play"
                            aria-label="Play Demo Track 4">
                        <i class="fa-solid fa-play"></i>
                    </button>
                </div>

            </section>

            <section class="music-player" aria-label="Audio player">
                <div class="now-playing">
                    <div class="mini-art">
                        <i class="fa-solid fa-compact-disc"></i>
                    </div>
                    <div>
                        <h2 id="current-title">Select a track</h2>
                        <p id="current-status">Music Portfolio</p>
                    </div>
                </div>

                <div class="player-controls">
                    <div class="control-buttons">
                        <button id="prev-track"
                                aria-label="Previous track">
                            <i class="fa-solid fa-backward-step"></i>
                        </button>

                        <button id="toggle-play"
                                class="main-play"
                                aria-label="Play">
                            <i class="fa-solid fa-play"></i>
                        </button>

                        <button id="next-track"
                                aria-label="Next track">
                            <i class="fa-solid fa-forward-step"></i>
                        </button>
                    </div>

                    <div class="timeline">
                        <span id="current-time">0:00</span>
                        <input id="seek-bar"
                            type="range"
                            min="0"
                            max="100"
                            value="0"
                            step="0.1"
                            aria-label="Seek through track">
                        <span id="duration">0:00</span>
                    </div>
                </div>
            </section>

            <audio id="audio-player" preload="metadata"></audio>

        </main>

        <script src="music-player.js"></script>
    </body>

</html>
